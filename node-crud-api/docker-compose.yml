services:
  postgres:
    image: postgres:18
    container_name: node-crud-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crud_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: